name: Check external links

# Run by hand from the Actions tab ("Run workflow"). Lists every external link in the
# site's pages, data and scripts, and reports any that are broken or have moved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect links
        run: |
          grep -rhoE 'https?://[A-Za-z0-9./?=_%:~+&;,@!*()#-]+' _data assets/js _layouts *.html \
            --include=*.html --include=*.js --include=*.json --include=*.yml \
            | sed -E 's/[).,;:]+$//' \
            | grep -vE 'fonts\.(googleapis|gstatic)\.com|w3\.org/2000|rdkit\.org|bucklesthomas\.github\.io|example\.' \
            | sort -u > links.txt
          wc -l links.txt
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 2
            --accept 200..=299,403,429
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
            links.txt
          output: lychee-report.md
          fail: false
      - name: Show report
        run: cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"; cat lychee-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: lychee-report.md
